services:
  - type: web
    name: saqib-tools
    env: python
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium
    startCommand: gunicorn app:app --bind 0.0.0.0:10000
    envVars:
      - key: RENDER
        value: "true"
      - key: SECRET_KEY
        generateValue: true
