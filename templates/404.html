<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Saqib SEO Tools Agency</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #F97316;
      --primary-hover: #EA580C;
      --slate-50: #0A0A0A;
      --slate-100: #1A1A1A;
      --slate-200: #27272A;
      --slate-400: #A1A1AA;
      --slate-500: #71717A;
      --slate-900: #000000;
      --radius-md: 10px;
      --font-sans: 'Inter', -apple-system, sans-serif;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: var(--font-sans);
      background-color: var(--slate-50);
      color: var(--slate-900);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 440px;
      padding: 40px 30px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
    }
    .icon {
      font-size: 64px;
      color: var(--slate-400);
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 14px;
      color: var(--slate-500);
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background-color: var(--primary);
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      border-radius: var(--radius-md);
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon"><i class="fas fa-compass"></i></div>
    <h1>404 - Page Not Found</h1>
    <p>We couldn't find the page you are looking for. The link might be broken or the page might have been removed.</p>
    <a href="/" class="btn"><i class="fas fa-home"></i> Go Back Home</a>
  </div>
</body>
</html>
