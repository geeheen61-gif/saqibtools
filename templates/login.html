<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - AccountHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --cyan: #06b6d4;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: #f1f5f9;
      color: var(--slate-900);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Ambient background blobs */
    .bg-blob-1 {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79, 70, 229, 0.1) 0%, rgba(255, 255, 255, 0) 70%);
      z-index: 0;
    }

    .bg-blob-2 {
      position: absolute;
      bottom: -10%;
      right: -10%;
      width: 50vw;
      height: 50vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.1) 0%, rgba(255, 255, 255, 0) 70%);
      z-index: 0;
    }

    .wrap {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      position: relative;
      z-index: 10;
    }

    .card {
      background-color: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: var(--radius-lg);
      padding: 40px 36px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--cyan));
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--primary), var(--cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.15);
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--slate-900);
    }

    h1 {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--slate-900);
      letter-spacing: -0.4px;
    }

    .sub {
      text-align: center;
      color: var(--slate-500);
      font-size: 13px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--slate-600);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--slate-400);
      font-size: 14px;
      pointer-events: none;
      transition: color 0.2s;
    }

    input {
      width: 100%;
      padding: 11px 12px 11px 40px;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-md);
      font-size: 14px;
      color: var(--slate-900);
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
      background-color: var(--slate-50);
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
      background-color: white;
    }

    input:focus + i {
      color: var(--primary);
    }

    input::placeholder {
      color: var(--slate-400);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--primary), #6366f1);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      margin-top: 8px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
    }

    .btn:hover {
      background: linear-gradient(135deg, var(--primary-hover), #4f46e5);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.25);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .flash {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      margin-bottom: 20px;
      background-color: #fef2f2;
      border: 1px solid #fee2e2;
      color: #ef4444;
      font-weight: 500;
    }

    .flash i {
      font-size: 14px;
    }

  </style>
</head>
<body>
  <div class="bg-blob-1"></div>
  <div class="bg-blob-2"></div>

  <div class="wrap">
    <div class="card">
      <div class="logo">
        <div class="logo-icon"><i class="fas fa-lock"></i></div>
        <span class="logo-text">AccountHub</span>
      </div>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to access your tools</p>

      {% with msgs = get_flashed_messages(with_categories=true) %}
        {% for cat,msg in msgs %}
          <div class="flash">
            <i class="fas fa-exclamation-circle"></i>
            <span>{{ msg }}</span>
          </div>
        {% endfor %}
      {% endwith %}

      <form method="POST">
        
        <div class="form-group">
          <label>Username</label>
          <div class="input-wrap">
            <input name="username" placeholder="Enter your username" required autofocus autocomplete="username">
            <i class="fas fa-user"></i>
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <input type="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            <i class="fas fa-lock"></i>
          </div>
        </div>
        <button type="submit" class="btn">Sign In</button>
      </form>
    </div>
  </div>
</body>
</html>
