<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background-color:#0A0A0A;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#0A0A0A;">
    <tr><td align="center" style="padding:30px 10px;">
      <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">
        <tr>
          <td style="background:linear-gradient(135deg,#1A1A1A,#18181B);border-radius:12px 12px 0 0;padding:30px 30px 20px;text-align:center;border-bottom:2px solid #F97316;">
            <h1 style="color:#FFFFFF;font-size:22px;margin:10px 0 0;">Saqib SEO Tools Agency</h1>
            <p style="color:#A1A1AA;font-size:13px;margin:5px 0 0;">Professional SEO Tools</p>
          </td>
        </tr>
        <tr>
          <td style="background-color:#1A1A1A;padding:30px;color:#D4D4D8;">
            {% block content %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="background-color:#18181B;border-radius:0 0 12px 12px;padding:20px 30px;text-align:center;border-top:1px solid #27272A;">
            <p style="color:#71717A;font-size:12px;margin:0;">
              &copy; 2026 Saqib SEO Tools Agency &mdash; All rights reserved.<br>
              You are receiving this email because you have an account with us.
            </p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
